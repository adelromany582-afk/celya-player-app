name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Setup Android
        run: |
          npm install
          npx cap add android || true
          npx cap sync android
          # إجبار التطبيق على الوضع العرضي Landscape داخل ملف الأندرويد الأساسي
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/g' android/app/src/main/AndroidManifest.xml

      - name: Grant Execute Permission for Gradle
        run: cd android && chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CELYA-Player-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
